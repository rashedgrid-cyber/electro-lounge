name: Electro Lounge RSS Radar

on:
  workflow_dispatch:

  schedule:
    # Run every day at 06:00 UTC
    # = 09:00 Saudi Arabia time
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  rss-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install RSS parser
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: Run Electro Lounge RSS Radar
        run: |
          python scripts/rss_radar.py

      - name: Save radar results
        run: |
          git config user.name "electro-lounge-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/rss-candidates.json

          if git diff --cached --quiet; then
            echo "No new RSS candidates."
          else
            git commit -m "Update Electro Lounge RSS candidates"
            git push
          fi
