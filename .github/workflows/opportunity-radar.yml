name: Electro Lounge Opportunity Radar

on:
  workflow_dispatch:

  schedule:
    # Daily at 06:30 UTC = 09:30 Saudi Arabia
    - cron: "30 6 * * *"

permissions:
  contents: write

jobs:
  opportunity-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Electro Lounge Opportunity Radar
        run: |
          python scripts/opportunity_radar.py

      - name: Save opportunity results
        run: |
          git config user.name "electro-lounge-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/opportunities.json

          if git diff --cached --quiet; then
            echo "No opportunity changes."
          else
            git commit -m "Update Electro Lounge opportunities"
            git push
          fi
