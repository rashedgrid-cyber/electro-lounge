name: Electro Lounge Intelligence Radar

on:
  workflow_dispatch:

  schedule:
    # Daily at 07:00 UTC = 10:00 Saudi Arabia
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  intelligence-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run W04 W05 W06 Intelligence Radar
        run: |
          python scripts/intelligence_radar.py

      - name: Save intelligence candidates
        run: |
          git config user.name "electro-lounge-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/intelligence-candidates.json

          if git diff --cached --quiet; then
            echo "No intelligence changes."
          else
            git commit -m "Update W04 W05 W06 intelligence candidates"
            git push
          fi
